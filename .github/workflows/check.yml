name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check shell syntax
        run: |
          for file in install.sh uninstall.sh files/etc/init.d/bili-ipv4 files/usr/libexec/bili-ipv4-control files/usr/libexec/bili-ipv4-monitor files/usr/libexec/bili-ipv4-uninstall; do
            sh -n "$file"
          done
      - name: Run synthetic packet tests
        run: python3 tests/test_learner.py --lua lua5.1
